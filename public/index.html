<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TactiVAR Manager</title>
  <link rel="stylesheet" href="style.css">
  <!-- Fejlfanger i sit eget script: en fejl i app-koden må aldrig give en tom side uden forklaring -->
  <script src="errors.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- v3.28.0: topbaren er én linje (VAR · klub · gem · ⚙); fanerne under den – på mobil fast i bunden; Spil-bjælken (v3.31.1: på alle faner) over dem -->
  <header class="topbar">
    <span class="badge" title="TactiVAR Manager">VAR</span>
    <h1 id="top-club" class="top-club">TactiVAR Manager</h1>
    <div id="controls" class="controls"></div>
    <div id="tabbar" class="tabbar"></div>
  </header>
  <div id="fejlboks" class="fejlboks" hidden></div>
  <main id="app"><p class="muted">Indlæser…</p></main>
  <div id="playbar" class="playbar"></div>
  <!-- v3.29.0: spillerkortet som ét panel (fra højre på computer, ark fra bunden på mobil) – ikke-modalt; app.js tegner indholdet -->
  <aside id="cardpanel" class="cardpanel" role="dialog" aria-modal="false" aria-label="Spillerkort" hidden data-open="nej"></aside>
</body>
</html>
