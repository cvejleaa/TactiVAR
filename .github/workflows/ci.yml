# Kører på hver PR og hvert push til main: statisk tjek, unit-tests og end-to-end i Chromium.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Version bumpet, når public/ er ændret
        if: github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          if git diff --quiet "$BASE" HEAD -- public/; then echo "public/ uændret"; exit 0; fi
          if git diff --quiet "$BASE" HEAD -- public/version.js; then
            echo "::error::public/ er ændret, men public/version.js er ikke bumpet – deploy-tjekket kan så ikke se, om den nye version er live."; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true   # nyeste 22.x, ikke runnerens cache; mindstekravet står i package.json engines
          cache: npm
      - name: Node opfylder package.json engines (sikkerhedsrettelser)
        run: node -e "const [a,b,c]=process.versions.node.split('.').map(Number),[x,y,z]=require('./package.json').engines.node.replace('>=','').split('.').map(Number);if(a!==x?a<x:b!==y?b<y:c<z){console.error('::error::Node '+process.version+' er ældre end engines '+x+'.'+y+'.'+z);process.exit(1)}console.log('Node '+process.version+' ok')"
      - run: npm ci --no-audit --no-fund
      - name: Statisk tjek (syntaks og imports)
        run: npm run check
      - name: Unit-tests
        run: npm test
      # v3.24.3 (kamp-id): Firestore-reglerne mod Auth- og Firestore-emulatoren (projekt demo-tactivar – aldrig produktion)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # Emulatorernes jar-filer hentes ellers på hver kørsel (firebase-tools' advarsel i loggen). Nøglen følger package-lock.json, så en ny
      # firebase-tools (= ny emulator-version) giver en ny cache; mangler en version i en gammel cache, henter emulatoren den selv.
      - name: Cache Firebase-emulatorerne
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: firebase-emulators-${{ runner.os }}-
      - name: Firestore-regler (emulator)
        run: npm run test:rules
      - name: End-to-end
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
