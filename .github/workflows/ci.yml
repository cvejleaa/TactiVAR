# Kører på hver PR og hvert push til main: statisk tjek, unit-tests og end-to-end i Chromium.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version bumpet, når public/ er ændret
        if: github.event_name == 'pull_request'
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          if git diff --quiet "$BASE" HEAD -- public/; then echo "public/ uændret"; exit 0; fi
          if git diff --quiet "$BASE" HEAD -- public/version.js; then
            echo "::error::public/ er ændret, men public/version.js er ikke bumpet – deploy-tjekket kan så ikke se, om den nye version er live."; exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          check-latest: true   # nyeste 22.x – ikke en ældre fra runnerens cache (Node-sikkerhedsrettelser, 2026-10-21: 22.23.4)
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Statisk tjek (syntaks og imports)
        run: npm run check
      - name: Unit-tests
        run: npm test
      - name: End-to-end
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
