# QC (2026-10-28, efter Node-sikkerhedsrettelserne): sikkerhedsopdateringer kommer som PR'er af sig selv i stedet for ved næste eftersyn.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
